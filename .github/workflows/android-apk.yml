name: Android APK (personal sideload)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/android-apk.yml

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'veyziao/dart_simple_live'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: simple_live_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: true

      # A new private key is generated per run and is never uploaded or cached.
      # APKs from different runs cannot update each other in place.
      - name: Generate temporary signing key
        run: |
          set -euo pipefail
          umask 077
          CI_SIGNING_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$CI_SIGNING_PASSWORD"
          export CI_SIGNING_PASSWORD
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/simple-live-ci.p12" \
            -storetype PKCS12 \
            -storepass:env CI_SIGNING_PASSWORD \
            -keypass:env CI_SIGNING_PASSWORD \
            -alias simplelive-ci \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Simple Live Personal CI"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/simple-live-ci.p12
          storePassword=$CI_SIGNING_PASSWORD
          keyPassword=$CI_SIGNING_PASSWORD
          keyAlias=simplelive-ci
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: simple-live-android-${{ github.run_number }}
          path: simple_live_app/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/simple-live-ci.p12"

      - name: Download instructions
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          Download the APK ZIP from **Artifacts** on this workflow run's summary page.
          Most modern Android phones use `app-arm64-v8a-release.apk`.
          Each run uses a fresh signing key. Installing a different run may require
          uninstalling the old app first, which deletes its local data.
          EOF
